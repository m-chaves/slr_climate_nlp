search:
  date_start: 2010-01-01
  date_end: 2026-04-30

semantic_scholar:
# All fields available in "Details about a paper" here: https://api.semanticscholar.org/api-docs/graph#tag/Paper-Data/operation/get_graph_get_paper

  # Fields for lightweight exploration queries
  fields_lite:
    - paperId
    - year
    - venue
    - citationCount

  # Fields for the main full collection query
  fields_full:
    - paperId
    - externalIds
    - title
    - year
    - publicationDate
    - abstract
    - publicationVenue
    - journal
    - citationCount
    - s2FieldsOfStudy
    - publicationTypes
    - authors

acl:
  # Local path to the Anthology data/ directory (the one containing xml/, yaml/, etc.).
  # If null, the library clones the ACL Anthology repo from GitHub on first run
  # (~1 GB) and caches it in the user data directory.
  anthology_dir: null

  # Check for other fields of interest at 
  # https://acl-anthology.readthedocs.io/py-v1.1.0/api/collections.paper/
  # https://acl-anthology.readthedocs.io/py-v1.1.0/api/collections.volume/ 
  # and other collection.* documentation

  fields_lite:
    - full_id          # ACL Anthology paper ID (e.g. "2022.emnlp-main.1")
    - title
    - year
    - venue_acronym   # e.g. "ACL", "EMNLP"       

  fields_full:
    - full_id          # ACL Anthology paper ID (e.g. "2022.emnlp-main.1")
    - title
    - abstract
    - year
    - authors         # List of {first, last, affiliation} dicts (affiliation often null)
    - doi
    - language        # ISO 639-2 code, may be null
    - journal_title   # Non-null for journal papers only
    - paper_type      # "paper", "frontmatter", or "backmatter"
    - volume_type     # "journal" or "proceedings"
    - volume_title    # Proceedings/journal title. Usually includes the volume number. May be equal to journal_title. 
    - venue_ids       # List of venue ID strings
    - venue_acronym   # e.g. "ACL", "EMNLP"
    - venue_full_id   # Volume full ID, e.g. "2022.emnlp-main"


scopus:
  # Fields available directly from ScopusSearch results (pybliometrics Document namedtuple).
  # Field names match pybliometrics attribute names exactly.
  # Note: "description" is what other sources call "abstract" — intentional naming.
  #
  # NOT available via ScopusSearch — require separate enrichment steps:
  #   - language    → to be handled at a later stage
  #   - references  → cited papers; not available via ScopusSearch

  fields_lite:
    - eid              # unique Scopus identifier (e.g. "2-s2.0-85193728453")
    - doi              # Digital Object Identifier
    - title            # paper title
    - coverDate        # publication date ("YYYY-MM-DD")

  fields_full:
    - eid              # unique Scopus identifier (e.g. "2-s2.0-85193728453")
    - doi              # Digital Object Identifier
    - title            # paper title
    - description      # abstract (Scopus API field: dc:description) — requires view="COMPLETE"
    - coverDate        # publication date ("YYYY-MM-DD")
    - publicationName  # journal or proceedings name (e.g. "Proceedings of EMNLP")
    - aggregationType  # venue category ("Journal", "Conference Proceeding", "Book Series")
    - subtypeDescription  # document type ("Article", "Conference Paper", "Review", ...)
    - authkeywords     # pipe-separated author-supplied keywords — requires view="COMPLETE"
    - citedby_count    # number of times this paper has been cited
    - openaccess       # open access status (1 = open access, 0 = not)
    - affilname        # semicolon-separated unique institution names (paper-level, deduplicated)
    - afid             # Scopus affiliation IDs, parallel to affilname by position

