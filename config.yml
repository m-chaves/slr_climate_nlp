search:
  date_start: 2010-01-01
  date_end: 2026-05-01

semantic_scholar:
# All fields available in "Details about a paper" here: https://api.semanticscholar.org/api-docs/graph#tag/Paper-Data/operation/get_graph_get_paper

  # Fields for lightweight exploration queries
  fields_lite:
    - paperId
    - title
    - year
    - venue
    - citationCount

  # Fields for the main full collection query
  fields_full:
    - paperId
    - externalIds
    - title
    - year
    - publicationDate
    - abstract
    - publicationVenue
    - journal
    - citationCount
    - s2FieldsOfStudy
    - publicationTypes
    - authors